<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qu’est-ce qu’on a ?</title>
<meta name="theme-color" content="#1F7A55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock coloc">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F1;--surface:#FFFFFF;--ink:#1C2320;--muted:#5E6A64;--line:#D9DFDA;
  --accent:#1F7A55;--accent-ink:#FFFFFF;--soft:#E3EDE7;
  --pantry:#A86A12;--fridge:#2B6CB0;--freezer:#5B4FCF;--danger:#B42318;--warn:#9A6700;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121815;--surface:#1B2320;--ink:#E8EEEA;--muted:#9AA8A0;--line:#2E3933;
    --accent:#4FBF8B;--accent-ink:#0E1A14;--soft:#203029;
    --pantry:#E0A54A;--fridge:#6AA6E8;--freezer:#A49AF2;--danger:#F27166;--warn:#E5B94E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121815;--surface:#1B2320;--ink:#E8EEEA;--muted:#9AA8A0;--line:#2E3933;
  --accent:#4FBF8B;--accent-ink:#0E1A14;--soft:#203029;
  --pantry:#E0A54A;--fridge:#6AA6E8;--freezer:#A49AF2;--danger:#F27166;--warn:#E5B94E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 120px}

header h1{font-size:clamp(2.1rem,8vw,3.2rem);line-height:.95;margin:8px 0 6px;
  font-weight:800;letter-spacing:-.03em;font-variation-settings:"opsz" 96}
.status{font-size:.875rem;color:var(--muted);min-height:1.3em;margin:0 0 16px}
.status.bad{color:var(--danger)}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);
  border-radius:14px;padding:0 14px;margin-bottom:12px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:0;background:transparent;padding:14px 0;font-size:1.05rem;outline:none;min-width:0}
.search svg{flex:none;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:.92rem;
  display:flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.65;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.l-pantry{--loc:var(--pantry)} .l-fridge{--loc:var(--fridge)} .l-freezer{--loc:var(--freezer)}
.dot{background:var(--loc)}

h2.zone{display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:700;margin:22px 0 8px;letter-spacing:-.01em}
h2.zone .dot{width:12px;height:12px}
h2.zone small{font-weight:400;color:var(--muted);font-size:.9rem}

.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-top:1px solid var(--line);min-height:58px}
.row:first-child{border-top:0}
.row .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--loc);flex:none}
.row .main{flex:1;min-width:0;background:none;border:0;padding:4px 0;text-align:left}
.row .name{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:.82rem;color:var(--muted)}
.row.out .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.tag.low{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.out{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}

.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;flex:none}
.stepper button{width:38px;height:38px;border:0;background:none;font-size:1.25rem;line-height:1;color:var(--muted)}
.stepper button:hover{color:var(--ink)}
.stepper .q{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem;white-space:nowrap}
.stepper .q small{font-weight:400;color:var(--muted)}

.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.small{padding:8px 12px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;
  box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 35%,transparent);padding:14px 20px;border-radius:16px}

/* recettes */
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.recipe > button.head{width:100%;display:flex;align-items:center;gap:12px;padding:16px;background:none;border:0;text-align:left}
.recipe .title{flex:1;font-weight:700;font-size:1.1rem;letter-spacing:-.01em}
.recipe .title small{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.gauge{flex:none;font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:999px}
.gauge.ok{background:var(--soft);color:var(--accent)}
.gauge.miss{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.recipe .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.ing{list-style:none;margin:12px 0;padding:0}
.ing li{display:flex;gap:10px;padding:5px 0;align-items:baseline}
.ing .mark{width:18px;flex:none;font-weight:800;text-align:center}
.ing .yes .mark{color:var(--accent)} .ing .no .mark{color:var(--danger)} .ing .part .mark{color:var(--warn)}
.ing .have{color:var(--muted);font-size:.85rem}
.steps{white-space:pre-wrap;color:var(--ink);margin:6px 0 14px;padding:12px 14px;background:var(--bg);border-radius:12px;font-size:.95rem;max-width:68ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* courses */
.add-line{display:flex;gap:8px;margin-bottom:18px}
.add-line input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.add-line input:focus{border-color:var(--accent);outline:none}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;padding:0}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row.done .name{color:var(--muted);text-decoration:line-through}
.loc-btn{border:1.5px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:.8rem;display:flex;gap:6px;align-items:center;flex:none}
.loc-btn[disabled]{cursor:default;opacity:.85}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;width:34px;height:34px;flex:none;line-height:1}
.x:hover{color:var(--danger)}
.store-bar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:14px;display:flex}
.store-bar .btn{flex:1}
.sugg{margin-top:28px}
.sugg p{color:var(--muted);margin:0 0 10px;font-size:.92rem}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:.8rem;color:var(--muted);font-weight:600;position:relative}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs .badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--accent);color:var(--accent-ink);font-size:.7rem;
  border-radius:999px;padding:0 6px;min-width:18px;text-align:center}

/* dialog */
dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 24px));background:var(--surface);color:var(--ink);
  max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(10,14,12,.45)}
dialog form{padding:20px;display:grid;gap:14px}
dialog h3{margin:0;font-size:1.35rem;letter-spacing:-.01em}
label.f{display:grid;gap:6px;font-weight:600;font-size:.92rem}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:400;font-size:1rem;width:100%}
label.f textarea{min-height:110px;resize:vertical}
label.f .hint{font-weight:400;color:var(--muted);font-size:.82rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:flex;gap:7px;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:10px;padding:10px 6px;font-size:.9rem}
.seg input:checked + span{border-color:var(--loc);background:color-mix(in srgb,var(--loc) 12%,transparent);font-weight:700}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.foot .r{display:flex;gap:8px;margin-left:auto}

.ro .needs-write{display:none !important}
.account{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);margin-bottom:4px;flex-wrap:wrap}
.account button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:.85rem}
.login{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 22px;max-width:46ch}
.login p{margin:0 0 18px;color:var(--muted)}
.login .btn{display:inline-flex;gap:10px;align-items:center}
@media (prefers-reduced-motion:no-preference){
  .row,.recipe{transition:background-color .2s}
  .flash{animation:flash .9s ease-out}
  @keyframes flash{from{background:var(--soft)}to{background:transparent}}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="account" id="account" hidden><span id="who"></span><button id="logout">Se déconnecter</button></div>
    <h1>Qu’est-ce qu’on a ?</h1>
    <p class="status" id="status">Chargement…</p>
  </header>

  <section id="view-login" hidden>
    <div class="login">
      <p>Connecte-toi avec ton compte Google pour voir et modifier le stock de la coloc. Seules les adresses autorisées ont accès aux données.</p>
      <button class="btn" id="login-btn"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 12h9" stroke="currentColor" stroke-width="2.4"/></svg>Se connecter avec Google</button>
    </div>
  </section>

  <section id="view-stock" hidden>
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Chercher un aliment" autocomplete="off" aria-label="Chercher un aliment">
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filtrer par endroit"></div>
    <div id="stock"></div>
    <button class="btn fab needs-write" data-act="new-item">+ Ajouter un aliment</button>
  </section>

  <section id="view-recipes" hidden>
    <div id="recipes"></div>
    <button class="btn fab needs-write" data-act="new-recipe">+ Ajouter une recette</button>
  </section>

  <section id="view-shop" hidden>
    <form class="add-line needs-write" id="shop-form">
      <input id="shop-input" placeholder="Ex. : 2 l lait, beurre, 500 g riz" autocomplete="off" aria-label="Ajouter à la liste de courses">
      <button class="btn" type="submit">Ajouter</button>
    </form>
    <div id="shop"></div>
  </section>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="stock"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 10h16M8 6.5v1M8 13v3"/></svg>Stock</button>
    <button data-tab="recipes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 11h14a7 7 0 0 1-14 0Z"/><path d="M9 7c0-1.5 1-2 1-3.5M14 7c0-1.5 1-2 1-3.5"/></svg>Recettes</button>
    <button data-tab="shop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 4h2l2.4 11h11L21 8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>Courses<span class="badge" id="shop-badge" hidden></span></button>
  </div>
</nav>

<dialog id="dlg-item">
  <form method="dialog" id="item-form">
    <h3 id="item-title">Ajouter un aliment</h3>
    <label class="f">Nom<input name="name" required maxlength="60" placeholder="Ex. : pâtes, œufs, lait"></label>
    <div class="two">
      <label class="f">Quantité<input name="qty" type="number" min="0" step="any" inputmode="decimal" value="1" required></label>
      <label class="f">Unité<select name="unit"></select></label>
    </div>
    <div class="f" role="radiogroup" aria-label="Endroit">
      <span style="font-weight:600;font-size:.92rem">Endroit</span>
      <div class="seg" id="item-loc"></div>
    </div>
    <label class="f">Prévenir quand il en reste
      <input name="min" type="number" min="0" step="any" inputmode="decimal" value="0">
      <span class="hint">À 0, l’aliment n’est signalé que lorsqu’il est épuisé.</span></label>
    <div class="foot">
      <button type="button" class="btn danger" id="item-del" hidden>Supprimer</button>
      <div class="r">
        <button type="button" class="btn ghost" data-close>Annuler</button>
        <button type="submit" class="btn" value="save">Enregistrer</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="dlg-recipe">
  <form method="dialog" id="recipe-form">
    <h3 id="recipe-title">Ajouter une recette</h3>
    <label class="f">Nom de la recette<input name="name" required maxlength="80" placeholder="Ex. : pâtes carbonara"></label>
    <label class="f">Pour combien de personnes<input name="serves" type="number" min="1" step="1" value="2"></label>
    <label class="f">Ingrédients
      <textarea name="ings" placeholder="200 g pâtes&#10;3 œufs&#10;100 g lardons&#10;parmesan" required></textarea>
      <span class="hint">Un par ligne : quantité, unité, puis nom. La quantité est facultative.</span></label>
    <label class="f">Étapes<textarea name="steps" placeholder="Faire cuire les pâtes…"></textarea></label>
    <div class="foot">
      <div class="r">
        <button type="button" class="btn ghost" data-close>Annuler</button>
        <button type="submit" class="btn" value="save">Enregistrer</button>
      </div>
    </div>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

(function(){
"use strict";
const LOCS = [
  {id:"pantry", label:"Garde-manger"},
  {id:"fridge", label:"Frigo"},
  {id:"freezer", label:"Congel"}
];
const LOC = Object.fromEntries(LOCS.map(l=>[l.id,l]));
const UNITS = ["pièce","g","kg","ml","cl","l","paquet","boîte","sachet","pot","bouteille","tranche","gousse"];
const COUNTABLE = new Set(["pièce","paquet","boîte","sachet","pot","bouteille","tranche","gousse"]);

const S = {items:[], recipes:[], shopping:[]};
let signedIn = false, readOnly = false, unsubs = [];
let tab = "stock", filter = "all", query = "", openRecipe = null, armed = null;

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/œ/g,"oe").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean)
  .map(w => w.length>3 ? w.replace(/(s|x)$/,"") : w).join(" ");
function fmtNum(n){ return (Math.round(n*100)/100).toLocaleString("fr-FR"); }
function fmtQty(q,u){
  if(q==null || q==="") return u && u!=="pièce" ? u : "";
  let unit = u || "";
  if(unit==="pièce") return fmtNum(q);
  if(COUNTABLE.has(unit) && q>1) unit += "s";
  return fmtNum(q) + " " + unit;
}
function unitStem(u){ u = (u||"").toLowerCase().replace(/\.$/,""); if(u.endsWith("s") && UNITS.includes(u.slice(0,-1))) u=u.slice(0,-1); return u; }
function toBase(q,u){
  u = unitStem(u);
  if(u==="kg") return {q:q*1000,u:"g"};
  if(u==="l") return {q:q*1000,u:"ml"};
  if(u==="cl") return {q:q*10,u:"ml"};
  return {q, u:u||"pièce"};
}
function fromBase(q,targetUnit){
  const t = unitStem(targetUnit);
  if(t==="kg") return q/1000; if(t==="l") return q/1000; if(t==="cl") return q/10; return q;
}
function parseLine(line){
  line = line.trim(); if(!line) return null;
  const m = line.match(/^(\d+(?:[.,]\d+)?)\s*([A-Za-zÀ-ÿ]+\.?)?\s+(?:de\s+|d’|d')?(.+)$/i)
         || line.match(/^(\d+(?:[.,]\d+)?)\s*()(.+)$/);
  if(m){
    const q = parseFloat(m[1].replace(",","."));
    let u = unitStem(m[2]||""), name = m[3];
    if(u && !UNITS.includes(u)){ name = (m[2]+" "+name); u = "pièce"; }
    return {name:name.trim(), qty:q, unit:u||"pièce"};
  }
  return {name:line, qty:null, unit:""};
}
function findStock(name){ const k = norm(name); return S.items.find(i => norm(i.name)===k) || null; }
function isLow(i){ return i.qty<=0 || (i.min>0 && i.qty<=i.min); }

/* ---------- stockage ---------- */
function write(col,id,data){
  if(readOnly || !signedIn) return;
  // affichage immédiat ; Firestore garde l’écriture en file d’attente si le réseau manque
  const arr = S[col], idx = arr.findIndex(x=>x.id===id);
  if(data==null){ if(idx>=0) arr.splice(idx,1); } else if(idx>=0) arr[idx]={id,...data}; else arr.push({id,...data});
  render();
  const ref = doc(fs, col, id);
  (data==null ? deleteDoc(ref) : setDoc(ref, {...data, updatedBy: auth.currentUser.email, updatedAt: Date.now()}))
    .catch(onWriteError);
}
const timers = {};
function writeLater(col,id,getData){
  clearTimeout(timers[col+id]);
  timers[col+id] = setTimeout(()=>{ const d = getData(); if(d) write(col,id,d); }, 600);
}
function strip(o){ const {id,updatedBy,updatedAt,...rest}=o; return rest; }
function onWriteError(e){
  if(e && e.code==="permission-denied"){ status("Ton compte n’a pas le droit de modifier ce stock.", true); }
  else status("Une modification n’a pas été enregistrée. Réessaie.", true);
}
function status(t,bad){ const el=$("#status"); el.textContent=t; el.classList.toggle("bad",!!bad); }
function netStatus(){
  if(!signedIn) return;
  if(!navigator.onLine) status("Hors ligne : tes modifications seront envoyées dès le retour du réseau.");
  else status("Synchronisé avec la coloc.");
}
window.addEventListener("online", netStatus);
window.addEventListener("offline", netStatus);

function startSync(){
  unsubs.forEach(u=>u()); unsubs = [];
  let pending = 3;
  ["items","recipes","shopping"].forEach(col=>{
    let first = true;
    unsubs.push(onSnapshot(collection(fs, col), { includeMetadataChanges: false }, snap=>{
      S[col] = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(first){ first=false; if(--pending===0) netStatus(); }
      render();
    }, err=>{
      if(err.code==="permission-denied") status(`Le compte ${auth.currentUser?.email||""} n’est pas sur la liste de la coloc. Demande qu’on l’ajoute aux règles Firestore.`, true);
      else status("Impossible de lire le stock pour l’instant. Vérifie ta connexion.", true);
    }));
  });
}

async function login(){
  const provider = new GoogleAuthProvider();
  try{ await signInWithPopup(auth, provider); }
  catch(e){
    if(e.code==="auth/popup-blocked" || e.code==="auth/operation-not-supported-in-this-environment") return signInWithRedirect(auth, provider);
    if(e.code!=="auth/popup-closed-by-user" && e.code!=="auth/cancelled-popup-request")
      status("La connexion a échoué : " + (e.code==="auth/unauthorized-domain" ? "ajoute ce domaine dans Firebase › Authentication › Settings › Authorized domains." : e.message), true);
  }
}
$("#login-btn").addEventListener("click", login);
$("#logout").addEventListener("click", ()=>signOut(auth));
getRedirectResult(auth).catch(()=>{});

function boot(){
  routeFromHash();
  onAuthStateChanged(auth, user=>{
    signedIn = !!user;
    $("#account").hidden = !user;
    $("#who").textContent = user ? user.email : "";
    if(user){ status("Chargement du stock…"); startSync(); }
    else { unsubs.forEach(u=>u()); unsubs=[]; S.items=[]; S.recipes=[]; S.shopping=[]; status(""); }
    render();
  });
}

/* ---------- navigation ---------- */
function routeFromHash(){ const h = location.hash.slice(1); tab = ["stock","recipes","shop"].includes(h) ? h : "stock"; }
window.addEventListener("hashchange", ()=>{ routeFromHash(); render(); });
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click", ()=>{ location.hash = b.dataset.tab; }));

/* ---------- rendu ---------- */
function render(){
  $("#view-login").hidden = signedIn;
  document.querySelector("nav.tabs").hidden = !signedIn;
  for(const t of ["stock","recipes","shop"]){
    $("#view-"+t).hidden = !signedIn || t!==tab;
    document.querySelector(`[data-tab="${t}"]`).setAttribute("aria-current", t===tab ? "page" : "false");
  }
  const open = S.shopping.filter(s=>!s.done).length, badge = $("#shop-badge");
  badge.hidden = !open; badge.textContent = open;
  if(tab==="stock") renderStock(); else if(tab==="recipes") renderRecipes(); else renderShop();
}

function renderStock(){
  const counts = {all:S.items.length};
  LOCS.forEach(l=>counts[l.id]=S.items.filter(i=>i.loc===l.id).length);
  $("#chips").innerHTML = [{id:"all",label:"Tout"},...LOCS].map(l=>
    `<button class="chip ${l.id!=="all"?"l-"+l.id:""}" data-filter="${l.id}" aria-pressed="${filter===l.id}">${l.id!=="all"?'<span class="dot"></span>':""}${l.label}<span class="n">${counts[l.id]}</span></button>`).join("");

  const qk = norm(query);
  let items = S.items.filter(i => (filter==="all"||i.loc===filter) && (!qk || norm(i.name).includes(qk)));
  const el = $("#stock");
  if(!S.items.length){
    el.innerHTML = `<div class="empty"><strong>Le stock est vide</strong>Ajoutez ce qu’il y a dans le garde-manger, le frigo et le congel pour commencer.</div>`; return;
  }
  if(!items.length){
    el.innerHTML = `<div class="empty"><strong>Aucun aliment ne correspond</strong>${qk ? `Il n’y a pas de « ${esc(query)} » à l’appart. <button class="btn small needs-write" style="margin-top:12px" data-act="add-shop-name" data-name="${esc(query)}">Ajouter aux courses</button>` : "Rien à cet endroit pour l’instant."}</div>`; return;
  }
  const groups = filter==="all" ? LOCS : [LOC[filter]];
  el.innerHTML = groups.map(l=>{
    const g = items.filter(i=>i.loc===l.id).sort((a,b)=>a.name.localeCompare(b.name,"fr"));
    if(!g.length) return "";
    return `<h2 class="zone l-${l.id}"><span class="dot"></span>${l.label} <small>${g.length} aliment${g.length>1?"s":""}</small></h2>
      <div class="list">${g.map(rowItem).join("")}</div>`;
  }).join("");
}
function rowItem(i){
  const out = i.qty<=0, low = !out && i.min>0 && i.qty<=i.min;
  return `<div class="row l-${i.loc} ${out?"out":""}" data-id="${esc(i.id)}">
    <span class="bar"></span>
    <button class="main" data-act="edit-item" data-id="${esc(i.id)}">
      <span class="name">${esc(i.name)}${out?'<span class="tag out">Épuisé</span>':low?'<span class="tag low">Bientôt fini</span>':""}</span>
      ${i.min>0?`<span class="meta">Alerte sous ${esc(fmtQty(i.min,i.unit))}</span>`:""}
    </button>
    <div class="stepper">
      <button class="needs-write" data-act="dec" data-id="${esc(i.id)}" aria-label="Retirer ${esc(i.name)}">−</button>
      <span class="q">${esc(fmtNum(i.qty))} <small>${esc(i.unit==="pièce"?"":i.unit)}</small></span>
      <button class="needs-write" data-act="inc" data-id="${esc(i.id)}" aria-label="Ajouter ${esc(i.name)}">+</button>
    </div>
  </div>`;
}
function stepFor(u){ return u==="g"||u==="ml" ? 50 : u==="kg"||u==="l" ? 0.25 : u==="cl" ? 10 : 1; }

function recipeStatus(r){
  return (r.ings||[]).map(ing=>{
    const s = findStock(ing.name);
    if(!s || s.qty<=0) return {ing, state:"no", s};
    if(ing.qty==null) return {ing, state:"yes", s};
    const need = toBase(ing.qty, ing.unit), have = toBase(s.qty, s.unit);
    if(need.u!==have.u) return {ing, state:"yes", s};
    if(have.q>=need.q) return {ing, state:"yes", s};
    return {ing, state:"part", s, missing:{q:need.q-have.q, u:need.u}};
  });
}
function renderRecipes(){
  const el = $("#recipes");
  if(!S.recipes.length){
    el.innerHTML = `<div class="empty"><strong>Pas encore de recettes</strong>Ajoutez vos plats habituels : l’appli vous dira ce que vous pouvez cuisiner avec ce qu’il y a à l’appart.</div>`; return;
  }
  const list = S.recipes.map(r=>({r, st:recipeStatus(r)})).map(x=>({...x, miss:x.st.filter(s=>s.state!=="yes").length}))
    .sort((a,b)=>a.miss-b.miss || a.r.name.localeCompare(b.r.name,"fr"));
  el.innerHTML = list.map(({r,st,miss})=>{
    const open = openRecipe===r.id;
    return `<article class="recipe">
      <button class="head" data-act="toggle-recipe" data-id="${esc(r.id)}" aria-expanded="${open}">
        <span class="title">${esc(r.name)}<small>${r.serves?`Pour ${esc(r.serves)} · `:""}${(r.ings||[]).length} ingrédient${(r.ings||[]).length>1?"s":""}</small></span>
        <span class="gauge ${miss?"miss":"ok"}">${miss?`Il manque ${miss}`:"Tout est là"}</span>
      </button>
      ${open?`<div class="body">
        <ul class="ing">${st.map(s=>`<li class="${s.state}"><span class="mark">${s.state==="yes"?"✓":s.state==="part"?"½":"✗"}</span>
          <span>${esc(fmtQty(s.ing.qty,s.ing.unit))} ${esc(s.ing.name)}
          <span class="have">${s.s&&s.s.qty>0?`— vous avez ${esc(fmtQty(s.s.qty,s.s.unit))}`:"— rien à l’appart"}</span></span></li>`).join("")}</ul>
        ${r.steps?`<div class="steps">${esc(r.steps)}</div>`:""}
        <div class="actions needs-write">
          ${miss?`<button class="btn small" data-act="recipe-shop" data-id="${esc(r.id)}">Ajouter les ${miss} manquants aux courses</button>`:""}
          <button class="btn small ${miss?"ghost":""}" data-act="cook" data-id="${esc(r.id)}">${armed==="cook"+r.id?"Confirmer : retirer du stock":"On l’a cuisinée"}</button>
          <button class="btn small ghost" data-act="edit-recipe" data-id="${esc(r.id)}">Modifier</button>
          <button class="btn small danger" data-act="del-recipe" data-id="${esc(r.id)}">${armed==="del"+r.id?"Confirmer la suppression":"Supprimer"}</button>
        </div>
      </div>`:""}
    </article>`;
  }).join("");
}

function renderShop(){
  const el = $("#shop");
  const items = [...S.shopping].sort((a,b)=>(a.done?1:0)-(b.done?1:0) || (a.at||0)-(b.at||0));
  const inList = new Set(S.shopping.map(s=>norm(s.name)));
  const sugg = S.items.filter(i=>isLow(i) && !inList.has(norm(i.name)));
  const done = items.filter(s=>s.done).length;
  let h = "";
  if(!items.length) h += `<div class="empty"><strong>La liste de courses est vide</strong>Ajoutez un produit ci-dessus, ou reprenez ce qui est bientôt fini.</div>`;
  else h += `<div class="list">${items.map(s=>{
      const st = findStock(s.name), loc = st ? st.loc : (s.loc||"pantry");
      return `<div class="row l-${loc} ${s.done?"done":""}">
        <button class="check needs-write" role="checkbox" aria-checked="${!!s.done}" aria-label="Acheté : ${esc(s.name)}" data-act="toggle-shop" data-id="${esc(s.id)}">${s.done?"✓":""}</button>
        <div class="main"><span class="name">${esc(s.name)}</span>
          <span class="meta">${s.qty!=null?esc(fmtQty(s.qty,s.unit))+" · ":""}${st?`en stock : ${esc(fmtQty(st.qty,st.unit))||"0"}`:"pas en stock"}</span></div>
        <button class="loc-btn" ${st||readOnly?"disabled":""} data-act="cycle-loc" data-id="${esc(s.id)}" title="${st?"Endroit du stock":"Changer l’endroit où le ranger"}"><span class="dot"></span>${LOC[loc].label}</button>
        <button class="x needs-write" data-act="del-shop" data-id="${esc(s.id)}" aria-label="Retirer ${esc(s.name)} de la liste">×</button>
      </div>`;}).join("")}</div>
      ${done?`<div class="store-bar needs-write"><button class="btn" data-act="store">Ranger ${done} achat${done>1?"s":""} dans le stock</button></div>`:""}`;
  if(sugg.length) h += `<div class="sugg"><h2 class="zone">Bientôt fini à l’appart</h2>
      <p>Ces aliments sont épuisés ou sous leur seuil d’alerte.</p>
      <div class="list">${sugg.map(i=>`<div class="row l-${i.loc}"><span class="bar"></span>
        <div class="main"><span class="name">${esc(i.name)}</span><span class="meta">Il reste ${esc(fmtQty(i.qty,i.unit))||"0"}</span></div>
        <button class="btn small ghost needs-write" data-act="sugg-add" data-id="${esc(i.id)}">Ajouter</button></div>`).join("")}</div>
      ${sugg.length>1?`<button class="btn ghost needs-write" style="margin-top:10px;width:100%" data-act="sugg-all">Tout ajouter à la liste</button>`:""}</div>`;
  el.innerHTML = h;
}

/* ---------- actions ---------- */
document.addEventListener("click", e=>{
  const f = e.target.closest("[data-filter]");
  if(f){ filter = f.dataset.filter; render(); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  const prevArmed = armed; if(!["cook","del-recipe"].includes(act)) armed = null;
  switch(act){
    case "new-item": openItem(null); break;
    case "edit-item": openItem(S.items.find(i=>i.id===id)); break;
    case "inc": case "dec": {
      const it = S.items.find(i=>i.id===id); if(!it || readOnly) return;
      const step = stepFor(it.unit);
      it.qty = Math.max(0, Math.round((it.qty + (act==="inc"?step:-step))*100)/100);
      render(); writeLater("items", id, ()=>{ const x=S.items.find(i=>i.id===id); return x && strip(x); });
      break;
    }
    case "add-shop-name": addShop(parseLine(b.dataset.name)); location.hash="shop"; break;
    case "new-recipe": openRecipeDlg(null); break;
    case "edit-recipe": openRecipeDlg(S.recipes.find(r=>r.id===id)); break;
    case "toggle-recipe": openRecipe = openRecipe===id ? null : id; armed=null; render(); break;
    case "recipe-shop": {
      const r = S.recipes.find(x=>x.id===id);
      const inList = new Set(S.shopping.map(s=>norm(s.name)));
      let n = 0;
      recipeStatus(r).forEach(s=>{
        if(s.state==="yes" || inList.has(norm(s.ing.name))) return;
        if(s.state==="part") addShop({name:s.ing.name, qty:s.missing.q, unit:s.missing.u});
        else addShop({name:s.ing.name, qty:s.ing.qty, unit:s.ing.unit});
        n++;
      });
      status(n ? `${n} ingrédient${n>1?"s":""} ajouté${n>1?"s":""} aux courses.` : "Tout était déjà sur la liste.");
      break;
    }
    case "cook": {
      if(prevArmed!=="cook"+id){ armed = "cook"+id; render(); return; }
      armed = null;
      const r = S.recipes.find(x=>x.id===id);
      (r.ings||[]).forEach(ing=>{
        const s = findStock(ing.name); if(!s) return;
        let used;
        if(ing.qty==null) return;
        const need = toBase(ing.qty, ing.unit), have = toBase(s.qty, s.unit);
        if(need.u!==have.u) return;
        used = fromBase(need.q, s.unit);
        write("items", s.id, {...strip(s), qty: Math.max(0, Math.round((s.qty-used)*100)/100)});
      });
      status(`Stock mis à jour après « ${r.name} ».`);
      break;
    }
    case "del-recipe": {
      if(prevArmed!=="del"+id){ armed = "del"+id; render(); return; }
      armed = null; write("recipes", id, null); break;
    }
    case "toggle-shop": {
      const s = S.shopping.find(x=>x.id===id); if(s) write("shopping", id, {...strip(s), done:!s.done}); break;
    }
    case "cycle-loc": {
      const s = S.shopping.find(x=>x.id===id); if(!s) return;
      const i = LOCS.findIndex(l=>l.id===(s.loc||"pantry"));
      write("shopping", id, {...strip(s), loc: LOCS[(i+1)%3].id}); break;
    }
    case "del-shop": write("shopping", id, null); break;
    case "sugg-add": { const i = S.items.find(x=>x.id===id); if(i) addShop({name:i.name, qty:null, unit:"", loc:i.loc}); break; }
    case "sugg-all": {
      const inList = new Set(S.shopping.map(s=>norm(s.name)));
      S.items.filter(i=>isLow(i) && !inList.has(norm(i.name))).forEach(i=>addShop({name:i.name, qty:null, unit:"", loc:i.loc}));
      break;
    }
    case "store": storePurchases(); break;
  }
});
$("#q").addEventListener("input", e=>{ query = e.target.value; renderStock(); });

function addShop(p){
  if(!p || !p.name) return;
  write("shopping", uid(), {name:p.name, qty:p.qty??null, unit:p.unit||"", loc:p.loc||(findStock(p.name)||{}).loc||"pantry", done:false, at:Date.now()});
}
$("#shop-form").addEventListener("submit", e=>{
  e.preventDefault();
  const inp = $("#shop-input");
  inp.value.split(/[,;\n]/).map(parseLine).filter(Boolean).forEach(addShop);
  inp.value = "";
});

function storePurchases(){
  const bought = S.shopping.filter(s=>s.done);
  let n = 0;
  bought.forEach(s=>{
    const st = findStock(s.name);
    if(st){
      let add = null;
      if(s.qty!=null){
        const a = toBase(s.qty, s.unit||"pièce"), h = toBase(1, st.unit);
        if(a.u===h.u) add = fromBase(a.q, st.unit);
      } else if(COUNTABLE.has(st.unit)) add = 1;
      if(add!=null) write("items", st.id, {...strip(st), qty: Math.round((st.qty+add)*100)/100});
    } else {
      const unit = s.qty!=null ? (unitStem(s.unit)||"pièce") : "pièce";
      write("items", uid(), {name: s.name.charAt(0).toUpperCase()+s.name.slice(1), qty: s.qty??1, unit: UNITS.includes(unit)?unit:"pièce", loc: s.loc||"pantry", min:0});
    }
    write("shopping", s.id, null); n++;
  });
  status(`${n} achat${n>1?"s":""} rangé${n>1?"s":""} dans le stock.`);
}

/* ---------- formulaires ---------- */
const dItem = $("#dlg-item"), fItem = $("#item-form");
fItem.unit.innerHTML = UNITS.map(u=>`<option value="${u}">${u}</option>`).join("");
$("#item-loc").innerHTML = LOCS.map(l=>`<label class="l-${l.id}"><input type="radio" name="loc" value="${l.id}"><span><span class="dot"></span>${l.label}</span></label>`).join("");
let editingItem = null;
function openItem(it){
  if(readOnly && !it) return;
  editingItem = it;
  $("#item-title").textContent = it ? "Modifier l’aliment" : "Ajouter un aliment";
  fItem.name.value = it ? it.name : (query||"");
  fItem.qty.value = it ? it.qty : 1;
  fItem.unit.value = it ? it.unit : "pièce";
  fItem.min.value = it ? (it.min||0) : 0;
  const loc = it ? it.loc : (filter!=="all"?filter:"pantry");
  fItem.querySelector(`input[name=loc][value=${loc}]`).checked = true;
  $("#item-del").hidden = !it || readOnly;
  $("#item-del").textContent = "Supprimer";
  [...fItem.elements].forEach(el=>{ if(el.dataset.close===undefined) el.disabled = readOnly; });
  dItem.showModal();
}
fItem.addEventListener("submit", e=>{
  if(readOnly){ return; }
  const name = fItem.name.value.trim(); if(!name){ e.preventDefault(); return; }
  const data = {name, qty: Math.max(0, parseFloat(fItem.qty.value)||0), unit: fItem.unit.value,
    loc: fItem.querySelector("input[name=loc]:checked").value, min: Math.max(0, parseFloat(fItem.min.value)||0)};
  if(!editingItem){
    const dup = findStock(name);
    if(dup && dup.loc===data.loc){ write("items", dup.id, {...data, qty: dup.unit===data.unit ? dup.qty+data.qty : data.qty}); return; }
  }
  write("items", editingItem ? editingItem.id : uid(), data);
});
$("#item-del").addEventListener("click", ()=>{
  const b = $("#item-del");
  if(b.textContent==="Supprimer"){ b.textContent = "Confirmer la suppression"; return; }
  write("items", editingItem.id, null); dItem.close();
});

const dRec = $("#dlg-recipe"), fRec = $("#recipe-form");
let editingRecipe = null;
function openRecipeDlg(r){
  if(readOnly) return;
  editingRecipe = r;
  $("#recipe-title").textContent = r ? "Modifier la recette" : "Ajouter une recette";
  fRec.name.value = r ? r.name : "";
  fRec.serves.value = r ? (r.serves||2) : 2;
  fRec.ings.value = r ? (r.ings||[]).map(i=>(i.qty!=null ? fmtNum(i.qty)+" "+(i.unit==="pièce"?"":i.unit+" ") : "")+i.name).map(s=>s.replace(/\s+/g," ").trim()).join("\n") : "";
  fRec.steps.value = r ? (r.steps||"") : "";
  dRec.showModal();
}
fRec.addEventListener("submit", e=>{
  const name = fRec.name.value.trim(); if(!name){ e.preventDefault(); return; }
  const ings = fRec.ings.value.split("\n").map(parseLine).filter(Boolean)
    .map(i=>({name:i.name, qty:i.qty, unit:i.qty!=null ? (i.unit||"pièce") : ""}));
  const id = editingRecipe ? editingRecipe.id : uid();
  write("recipes", id, {name, serves: parseInt(fRec.serves.value)||null, ings, steps: fRec.steps.value.trim()});
  openRecipe = id;
});
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click", ()=>b.closest("dialog").close()));

boot();
})();
</script>
</body>
